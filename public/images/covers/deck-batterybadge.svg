<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Deck-BatteryBadge">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c56a3a"/>
      <stop offset="100%" stop-color="#5e2c14"/>
    </linearGradient>
    <pattern id="dots2" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="640" height="440" fill="url(#bg2)"/>
  <rect width="640" height="440" fill="url(#dots2)"/>

  <g transform="translate(230,90)" fill="none" stroke="#fff3ea" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- badge -->
    <path d="M90 0 L118 16 V52 C118 92 90 118 90 118 C90 118 62 92 62 52 V16 Z" fill="#fff3ea" fill-opacity="0.14"/>
    <path d="M76 58 L86 44 L94 56 L104 40" stroke-opacity="0.95"/>
    <!-- battery -->
    <g transform="translate(0,150)">
      <rect x="0" y="10" width="150" height="60" rx="8" fill="#fff3ea" fill-opacity="0.14"/>
      <rect x="150" y="26" width="12" height="28" rx="3" fill="#fff3ea" stroke="none"/>
      <rect x="14" y="24" width="65" height="32" rx="3" fill="#fff3ea" fill-opacity="0.85" stroke="none"/>
    </g>
  </g>

  <text x="40" y="380" font-family="'DM Mono', monospace" font-size="13" letter-spacing="2" fill="#fff3ea" fill-opacity="0.65">STEAM DECK · PLUGIN</text>
  <text x="40" y="410" font-family="'DM Serif Display', serif" font-size="30" fill="#fff8f2">Deck-BatteryBadge</text>
</svg>
