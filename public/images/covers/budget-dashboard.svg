  <g transform="translate(220,110)" fill="none" stroke="#eafff0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="190" x2="200" y2="190" stroke-opacity="0.5"/>
    <rect x="10"  y="120" width="34" height="70" rx="4" fill="#eafff0" fill-opacity="0.18" stroke-opacity="0.9"/>
    <rect x="64"  y="80"  width="34" height="110" rx="4" fill="#eafff0" fill-opacity="0.28" stroke-opacity="0.95"/>
    <rect x="118" y="40"  width="34" height="150" rx="4" fill="#eafff0" fill-opacity="0.4"/>
    <rect x="172" y="95"  width="34" height="95"  rx="4" fill="#eafff0" fill-opacity="0.28" stroke-opacity="0.95"/>
    <circle cx="205" cy="18" r="22" fill="none" stroke-opacity="0.85"/>
    <path d="M197 18 h16 M205 10 v16" stroke-opacity="0.85"/>
  </g>

  <text x="40" y="380" font-family="'DM Mono', monospace" font-size="13" letter-spacing="2" fill="#eafff0" fill-opacity="0.65">FINANZAS · DESKTOP APP</text>
  <text x="40" y="410" font-family="'DM Serif Display', serif" font-size="30" fill="#f5fff8">BudgetDashboard</text>
</svg>
