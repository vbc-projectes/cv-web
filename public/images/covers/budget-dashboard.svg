      <stop offset="0%" stop-color="#2f7a48"/>
      <stop offset="100%" stop-color="#153d24"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="640" height="440" fill="url(#bg)"/>
